name: validate

on:
  push:
    branches: [main]
  pull_request:
  # The repository's value depends on being current, so a stale-check runs even when nobody
  # pushes. Quarterly, on the first of January, April, July and October.
  schedule:
    - cron: "0 6 1 1,4,7,10 *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Schemas reject bad artefacts
        run: npm test

      - name: Capture chain and tamper detection
        run: npm run test:capture

      - name: Examples validate
        run: npm run validate

      - name: Demo store verifies (chain intact, records valid)
        # GLASSBOX_NOW pins "now" so the pending-review ageing check is deterministic in CI.
        run: npm run verify:demo
        env:
          GLASSBOX_NOW: "2026-07-25T12:00:00Z"

      - name: Relative links resolve
        run: npm run check:links

  stale-check:
    # Flags documents whose last_verified date has aged past the point where they should be
    # trusted. Advisory — it opens no issue and blocks nothing, it just makes the age visible
    # in the run log so the quarterly review has somewhere to start.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Report last_verified ages
        run: |
          echo "Documents by last_verified date (see MAINTENANCE.md for the convention):"
          grep -rn "last_verified:" --include="*.md" --include="*.yaml" . \
            | grep -v node_modules \
            | sort -t: -k3
